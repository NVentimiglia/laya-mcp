[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-jev"
version = "0.1.0"
description = "Jev (TypeSafe System One) client with a Laya-compatible predict()"
requires-python = ">=3.10"
dependencies = [
  "typesafe-sdk>=0.1.0",
  "certifi>=2024.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.setuptools]
py-modules = ["jev_client"]

[tool.ruff]
line-length = 100
target-version = "py310"
